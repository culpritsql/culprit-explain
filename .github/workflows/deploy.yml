name: Deploy Website

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [upstream-pkg-published]
  schedule:
    - cron: "35 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build & pre-render SEO routes
    if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[skip ci]'))"
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: check
        name: Resolve latest @culpritsql packages
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PLANS_LATEST="$(npm view @culpritsql/plans version)"
          VIEWER_LATEST="$(npm view @culpritsql/plan-viewer version)"
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies["@culpritsql/plans"] = process.argv[1];
            pkg.dependencies["@culpritsql/plan-viewer"] = process.argv[2];
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$PLANS_LATEST" "$VIEWER_LATEST"
          bun install --no-cache

          if [ "$EVENT_NAME" = "schedule" ] && git diff --quiet -- package.json bun.lock; then
            echo "No upstream @culpritsql package updates on schedule; skipping Pages deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
      - id: pages
        if: steps.check.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5
      - name: Run unit and Wasm round-trip tests
        if: steps.check.outputs.should_deploy == 'true'
        run: bun test
      - name: Build client, SSR pre-render, and SEO artifacts
        if: steps.check.outputs.should_deploy == 'true'
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: bun run build
      - name: Commit updated @culpritsql lockfile to main
        if: steps.check.outputs.should_deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json bun.lock; then
            exit 0
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="$AUTH_HEADER"

          git config user.name "culprit-bot"
          git config user.email "noreply@culpritsql.com"
          git add package.json bun.lock
          git commit -m "chore(deps): sync @culpritsql packages [skip ci]"
          git push origin HEAD:main || true
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.should_deploy == 'true'
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
