name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & SEO build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
